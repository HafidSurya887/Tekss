<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Text Deep Purple</title>
    <style>
        body {
            background-color: #000; /* Hitam */
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', sans-serif;
        }

        .marquee-container {
            width: 100%;
            white-space: nowrap;
        }

        .text-jalan {
            display: inline-block;
            font-size: 22vw; 
            font-weight: bold;
            /* Warna Ungu Tua Solid */
            color: #4B0082; 
            animation: jalan 25s linear infinite;
        }

        @keyframes jalan {
            from { transform: translateX(100%); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="text-jalan">(YANG AVI DAPET CUMA KATA SINGKAT, YANG LAIN DAPET CERITA LENGKAP) FROM:ORANG GILUY</div>
    </div>

</body>
</html>
